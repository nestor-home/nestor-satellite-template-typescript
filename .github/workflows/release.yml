# Release pull request on every push to main, from the Conventional Commits since the last release.
# Merging it tags vX.Y.Z and creates the GitHub Release.
#
# In your own repository (see the README, "Release"):
# 1. Replace the `release` job with the commented one under it: the first runs nestor-home's shared
#    workflow, which acts as that organization's GitHub App, so it only runs in nestor-home.
# 2. To publish on npm, register a trusted publisher, then uncomment the `npm` job.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.repository_owner == 'nestor-home'
    uses: nestor-home/.github/.github/workflows/release-please.yml@main
    secrets: inherit
    with:
      automerge: true  # publish as soon as a release is ready: dependencies follow on their own

